# SonarQube Cloud Project Configuration
sonar.organization=velocta-1
sonar.projectKey=Velocta_fbuploadpro2
sonar.projectName=FBUploadPro Monorepo

# Monorepo Source Directories
sonar.sources=apps/web/src,apps/worker/src,packages/contracts/src,packages/database/src
sonar.tests=apps/web,apps/worker,packages/contracts,packages/database
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**

# Exclusions (dependencies, build outputs, coverage, migrations, CI scripts)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.config.*,**/supabase/migrations/**,**/packages/database/migrations/**,**/.github/scripts/**

# Test Coverage (Vitest LCOV outputs if generated)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/worker/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/database/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
