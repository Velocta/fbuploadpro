# SonarQube Cloud Project Configuration
sonar.organization=velocta-1
sonar.projectKey=Velocta_fbuploadpro2
sonar.projectName=FBUploadPro Monorepo

# Exclusions (SonarCloud New Analysis Scope UX)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.*,**/supabase/migrations/**,**/packages/database/migrations/**,**/.github/scripts/**,**/*.sql,**/*.sh,**/.specify/**
sonar.global.exclusions=**/supabase/migrations/**,**/packages/database/migrations/**,**/*.sql,**/*.sh,**/.specify/**

# Test Coverage (Vitest LCOV outputs if generated)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/worker/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/database/coverage/lcov.info

# Duplication Exclusions (UI primitive components and immutable database SQL migrations)
sonar.cpd.exclusions=apps/web/src/components/ui/**,**/migrations/**,**/*.sql

# Coverage Exclusions (until @vitest/coverage-v8 reporting pipeline is introduced)
sonar.coverage.exclusions=**/*

# Encoding
sonar.sourceEncoding=UTF-8
