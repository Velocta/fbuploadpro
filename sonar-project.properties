# SonarQube Cloud Project Configuration
sonar.organization=velocta-1
sonar.projectKey=Velocta_fbuploadpro2
sonar.projectName=FBUploadPro Monorepo

# Exclusions (SonarCloud New Analysis Scope UX)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.*,**/supabase/migrations/**,**/.github/scripts/**,**/*.sql,**/*.sh,**/.specify/**,**/apps/desktop/public/**
sonar.global.exclusions=**/supabase/migrations/**,**/*.sql,**/*.sh,**/.specify/**,**/apps/desktop/public/**

# Test Coverage (Vitest LCOV outputs if generated)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/worker/coverage/lcov.info,packages/contracts/coverage/lcov.info

# Duplication Exclusions (UI presentation components, app views, test suites, and database migrations)
sonar.cpd.exclusions=apps/web/src/components/**,apps/web/src/app/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/migrations/**,**/*.sql

# Coverage Exclusions (Scope strictly to configs, tests, UI components, app pages, and worker runtime entrypoint)
sonar.coverage.exclusions=**/*.config.*,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/web/src/components/**,apps/web/src/app/**,apps/worker/src/index.ts

# Encoding
sonar.sourceEncoding=UTF-8
