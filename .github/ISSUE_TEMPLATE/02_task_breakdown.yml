name: "⚡ 2. AI Implementation Task"
description: "An atomic, verifiable implementation task derived from an approved Spec (<150-200 LoC)"
title: "[TASK]: <Spec ID> - <Concise Action Title>"
labels: ["type:task", "phase:implementation", "ai:ready"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚡ Atomic Implementation Task
        This task is sized for a single AI agent or human PR cycle (<150-200 lines net change). It must be linked to an approved specification.

  - type: input
    id: parent_spec
    attributes:
      label: "Parent Specification"
      description: "Path or link to the approved spec file (e.g. `specs/0001-spec-driven-development-standard.md` or `SPEC-0001`)"
      placeholder: "SPEC-0001"
    validations:
      required: true

  - type: input
    id: spec_version
    attributes:
      label: "Parent Spec Version or Commit SHA"
      description: "Pin the exact spec version (e.g. `v1.0` or git commit SHA) to prevent stale spec drift."
      placeholder: "v1.0"
    validations:
      required: true

  - type: textarea
    id: task_objective
    attributes:
      label: "1. Task Objective & Target Spec Section"
      description: "What exact slice of the spec does this task deliver?"
      placeholder: "Implements Section 4.2 data models and Section 3 Scenario 1 acceptance criteria..."
    validations:
      required: true

  - type: textarea
    id: allowed_files
    attributes:
      label: "2. Target File Scope (Allowed File Boundaries)"
      description: "Strict file path list that the agent is allowed to create or modify."
      placeholder: |
        - `src/domain/model.ts` (create)
        - `src/domain/index.ts` (modify)
        - `tests/domain/model.test.ts` (create)
    validations:
      required: true

  - type: textarea
    id: verification_command
    attributes:
      label: "3. Verification Command Recipe"
      description: "Terminal commands the agent must run to verify this task before opening a PR."
      placeholder: |
        npm run lint
        npm test -- tests/domain/model.test.ts
    validations:
      required: true

  - type: dropdown
    id: assigned_agent
    attributes:
      label: "4. Assigned Agent / Worker"
      description: "Who or what entity will execute this task?"
      options:
        - "Antigravity Agent"
        - "Claude Code"
        - "GitHub Copilot Workspace"
        - "Human Engineer"
        - "Unassigned (Open in Backlog)"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: "5. Complexity Estimate"
      description: "Keep tasks strictly under 200 LoC (target: 50–150 LoC). Tasks exceeding 200 LoC must be split."
      options:
        - "XS / Micro (< 50 lines changed - bugfix or batched)"
        - "S / Optimal (50 - 150 lines changed - target slice)"
        - "M / Ceiling (150 - 200 lines changed - maximum single task)"
    validations:
      required: true

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: "Definition of Done (DoD)"
      options:
        - label: "Unit/integration test written and passing (TDD Red-Green-Refactor)."
          required: true
        - label: "Zero type errors and zero linter warnings."
          required: true
        - label: "Net code diff is within bounds (<200 LoC; if >200 LoC, task split requested)."
          required: true
        - label: "Changes restricted strictly to allowed file boundaries (or approved SBEP)."
          required: true
        - label: "PR title follows Conventional Commits with spec reference."
          required: true
