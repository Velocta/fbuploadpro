name: "🐛 3. Spec Defect / Regression Report"
description: "Report when running code deviates from an approved specification or test fails"
title: "[DEFECT]: <Spec ID> - <Description of Deviation>"
labels: ["type:defect", "phase:triage", "ai:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Spec Defect Report
        In Spec-Driven Development, a bug is a proven deviation from an approved specification.

  - type: input
    id: violated_spec
    attributes:
      label: "Violated Specification & Section"
      description: "Example: `SPEC-0001 Section 4.2` or link to spec"
      placeholder: "SPEC-0001 Section 4.2"
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: "Expected vs. Actual Behavior"
      description: "Quote the spec contract and show how current behavior deviates."
      placeholder: |
        - **Spec Invariant:** "Returns 400 Bad Request when payload lacks `userId`."
        - **Actual Behavior:** "Returns 500 Internal Server Error unhandled exception."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "Reproduction Steps or Failing Test Case"
      description: "Provide exact commands or test case asserting this failure."
      placeholder: |
        1. Run `npm test -- tests/auth.test.ts`
        2. Observe assertion failure at line 42.
    validations:
      required: true

  - type: dropdown
    id: defect_type
    attributes:
      label: "Root Cause Classification"
      description: "Is the implementation wrong, or was the specification ambiguous?"
      options:
        - "Implementation Bug (Code violated clear spec contract)"
        - "Spec Ambiguity / Gap (Spec lacked required invariant or edge case)"
        - "Regression (Previously working test now failing)"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - "Critical - Production breaking / Security invariant violated"
        - "High - Primary user journey blocked"
        - "Medium - Minor edge case deviation"
        - "Low - Polish / Typo in error message"
    validations:
      required: true
