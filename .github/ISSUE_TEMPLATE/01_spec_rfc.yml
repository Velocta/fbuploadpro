name: "📐 1. Spec RFC / Proposal"
description: "Propose a new architecture, feature, or subsystem specification (Phase 1)"
title: "[SPEC RFC]: <Short Feature Description>"
labels: ["type:spec", "spec:draft", "phase:spec"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📐 Spec-Driven Development: RFC & Spec Proposal
        Every new capability in this repository requires an approved specification before any code is merged. Fill out this form or link a draft spec in `specs/`.

  - type: input
    id: spec_id
    attributes:
      label: "Proposed Spec ID"
      description: "Next sequential Spec ID (e.g., SPEC-0002)"
      placeholder: "SPEC-0002"
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: "1. Problem Statement & Motivation"
      description: "What problem does this solve? Why is this necessary now?"
      placeholder: "Describe the current limitation and the desired end state..."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "2. Scope (In-Scope Capabilities)"
      description: "List the exact features and capabilities included in this spec."
      placeholder: |
        - [ ] Add domain entity XYZ
        - [ ] Provide REST/GraphQL API for ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: "3. Non-Goals (Strict Out-of-Scope)"
      description: "Crucial for AI agents: Explicitly list what this feature will NOT do."
      placeholder: |
        - No third-party payment integration in this phase
        - No UI dashboard changes
    validations:
      required: true

  - type: textarea
    id: technical_design
    attributes:
      label: "4. Architecture & Technical Design Overview"
      description: "Data schemas, interfaces, sequence flows, or external services touched."
      placeholder: "Outline data models, API endpoints, or architecture diagrams..."
    validations:
      required: true

  - type: dropdown
    id: ai_readiness
    attributes:
      label: "5. AI Agent Readiness"
      description: "Is this spec ready for an autonomous agent to implement once approved?"
      options:
        - "Drafting - Needs human architectural refinement"
        - "Ready - Fully specified, contracts defined, ready for AI task dispatch"
        - "Human Only - Requires complex external coordination"
    validations:
      required: true

  - type: checkboxes
    id: validation_checks
    attributes:
      label: "Checklist"
      options:
        - label: "I have read SPEC-0001 (Spec-Driven Development Standard)."
          required: true
        - label: "I will open a corresponding branch `spec/<spec-id>` with the markdown spec in `specs/`."
          required: true
