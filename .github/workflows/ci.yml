name: CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Turbo build, lint & typecheck
        run: pnpm turbo run build lint typecheck

      - name: Run Turbo test with Vitest coverage
        run: pnpm turbo run test -- --coverage

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo check desktop
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Cargo clippy desktop
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Cargo test desktop
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  dependency-audit:
    name: Dependency Audit (pnpm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies (fail on moderate/high/critical)
        run: pnpm audit --audit-level=moderate

  regression-guardrails:
    name: Regression Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run regression guardrails
        run: bash .github/scripts/regression-guardrails.sh

      - name: Run Check 10 multi-line fixture tests
        run: bash .github/scripts/tests/check-10-multiline.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Design token parity check (spec 129)
        run: pnpm --filter @fbuploadpro/web run tokens:check

  bundle-report:
    # Bundle visibility (spec 137 §3.6.2 / PR-A4): builds apps/web with
    # the bundle analyzer and uploads the report as an artifact on PRs
    # touching the web app. Budgets are report-only (decision D137-3) —
    # this job never fails on size; it exists so every PR's bundle
    # impact is visible. (Like the other jobs it runs under this
    # workflow's main-targeted triggers; stacked PRs show Vercel only.)
    name: Bundle Report (analyzer artifact)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build contracts (web build dependency)
        run: pnpm --filter @fbuploadpro/contracts build

      - name: Webpack build with bundle analyzer (report-only)
        # The analyzer needs a webpack build; production stays on
        # Turbopack. next.config.ts scopes its route-type-validator
        # exemption to ANALYZE=true builds for exactly this run.
        run: pnpm --filter @fbuploadpro/web exec next build --webpack
        env:
          ANALYZE: 'true'

      - name: Upload bundle analyzer report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-analyzer-report
          path: apps/web/.next/analyze/
          if-no-files-found: warn

  e2e-changes:
    name: Detect apps/web changes (Playwright gate)
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check whether apps/web changed
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}...${{ github.event.after }}"
          fi
          if git diff --name-only "$RANGE" -- apps/web | grep -q .; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    name: Playwright E2E (Chromium)
    needs: e2e-changes
    if: needs.e2e-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build contracts (web build dependency)
        run: pnpm --filter @fbuploadpro/contracts build

      - name: Install Chromium for Playwright
        run: pnpm --filter @fbuploadpro/web exec playwright install --with-deps chromium

      - name: Run Playwright e2e (production build, 1 retry in CI)
        run: pnpm --filter @fbuploadpro/web run test:e2e

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/tests/e2e/.results/
          retention-days: 14
          if-no-files-found: ignore

