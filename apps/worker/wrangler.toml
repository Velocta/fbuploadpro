name = "fbuploadpro-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *", "0 2 * * *"]

[vars]
DISPATCH_BATCH_SIZE = "250"
DISPATCH_CONCURRENCY = "25"
DISPATCH_MAX_BATCHES_PER_TICK = "5"

