<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FBUploadPro</title>
  <!-- Offline fallback page (spec 145 §5.4). This is a native-shell asset,
       NOT a web-app surface: plain system styling, no design-system tokens,
       no web-app assets. It works with zero web-app assets available. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000; color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none;
    }
    .titlebar {
      height: 36px; background-color: #000000; border-bottom: 1px solid #1f242d;
      display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 12px;
      -webkit-app-region: drag;
    }
    .titlebar-brand { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: #d1d5db; }
    .titlebar-controls { display: flex; align-items: center; -webkit-app-region: no-drag; height: 100%; }
    .window-btn {
      background: none; border: none; color: #d1d5db; width: 42px; height: 36px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px;
    }
    .window-btn:hover { background-color: #1f242d; color: #ffffff; }
    .window-btn.close:hover { background-color: #d92d20; color: #ffffff; }
    .content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card {
      background-color: #0c0d10; border: 1px solid #1f242d; border-radius: 8px;
      padding: 32px; max-width: 440px; width: 100%; text-align: center;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: #d1d5db; line-height: 1.5; margin-bottom: 12px; }
    .host { font-size: 13px; color: #9ca3af; margin-bottom: 24px; word-break: break-all; }
    .status { font-size: 13px; color: #fad734; min-height: 20px; margin-bottom: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; width: 100%;
    }
    .btn-retry { background-color: #fad734; color: #000000; font-weight: 700; margin-bottom: 8px; }
    .btn-retry:disabled { opacity: 0.5; cursor: default; }
    .btn-browser { background: none; color: #d1d5db; border: 1px solid #1f242d; }
    .btn-browser:hover { color: #ffffff; }
  </style>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar-brand" data-tauri-drag-region><span>FBUploadPro</span></div>
    <div class="titlebar-controls" data-tauri-drag-region="false">
      <button type="button" class="window-btn" id="btn-minimize" aria-label="Minimize window">–</button>
      <button type="button" class="window-btn" id="btn-maximize" aria-label="Maximize or restore window">▢</button>
      <button type="button" class="window-btn close" id="btn-close" aria-label="Close window">✕</button>
    </div>
  </header>
  <main class="content">
    <div class="card">
      <h1>You're offline</h1>
      <p>FBUploadPro couldn't be reached. Check your connection, then try again — your workspace will load as soon as it's reachable.</p>
      <div class="host" id="attempted-host"></div>
      <div class="status" id="status"></div>
      <button type="button" class="btn btn-retry" id="btn-retry">Retry</button>
      <button type="button" class="btn btn-browser" id="btn-browser">Open in browser</button>
    </div>
  </main>
  <script>
    async function invoke(command, args) {
      if (window.__TAURI_INTERNALS__?.invoke) return window.__TAURI_INTERNALS__.invoke(command, args);
      if (window.__TAURI__?.core?.invoke) return window.__TAURI__.core.invoke(command, args);
      throw new Error('Tauri invoke unavailable');
    }
    async function invokeAction(action) {
      try { await invoke('handle_window_action', { action }); } catch (err) { console.warn('Action failed', err); }
    }
    document.getElementById('btn-minimize').addEventListener('click', () => invokeAction('minimize'));
    document.getElementById('btn-maximize').addEventListener('click', () => invokeAction('toggle_maximize'));
    document.getElementById('btn-close').addEventListener('click', () => invokeAction('close'));

    let startUrl = null;
    let attempts = 0;
    // Show only the attempted host, never the full URL or any query string.
    invoke('shell_get_start_url', { payload: {} }).then((res) => {
      startUrl = res.url;
      try { document.getElementById('attempted-host').textContent = 'Tried to reach: ' + new URL(res.url).host; }
      catch { document.getElementById('attempted-host').textContent = ''; }
    }).catch(() => {});
    document.getElementById('btn-browser').addEventListener('click', async () => {
      if (!startUrl) return;
      try { await invoke('open_external_url', { url: startUrl }); } catch (err) { console.warn('Open failed', err); }
    });
    // Retry is user-initiated, one attempt per click — no auto-retry loop.
    document.getElementById('btn-retry').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      attempts += 1;
      const status = document.getElementById('status');
      status.textContent = 'Checking connection…';
      try {
        const res = await invoke('shell_retry_connection', { payload: {} });
        if (res.reachable) {
          status.textContent = 'Connected — loading your workspace…';
          // The shell navigates the main window on success (§7.3).
        } else {
          status.textContent = 'Still unreachable (attempt ' + attempts + '). Try again in a moment.';
          btn.disabled = false;
        }
      } catch (err) {
        status.textContent = 'Still unreachable (attempt ' + attempts + '). Try again in a moment.';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
