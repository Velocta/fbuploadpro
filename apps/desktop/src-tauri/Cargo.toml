[package]
name = "fbuploadpro-desktop"
version = "0.1.0"
description = "FBUploadPro Native Desktop Client (Tauri v2)"
edition = "2021"

[lib]
name = "fbuploadpro_desktop"
path = "src/lib.rs"

[[bin]]
name = "fbuploadpro-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }
zip = "2"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
opt-level = 3
