name = "fbuploadprov2-prod-posting-02-downloader"
main = "src/index.js"
compatibility_date = "2024-02-05"

[secrets]
required = ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "PUBLISH_CALLBACK_TOKEN", "DATACENTER_PROXY", "RESIDENTIAL_PROXY"]

[observability]
enabled = true

[[queues.consumers]]
queue = "fbuploadprov2-prod-posting-download-jobs"
max_batch_size = 3
max_batch_timeout = 5
max_retries = 5

[[services]]
binding = "PUBLISHER"
service = "fbuploadprov2-prod-posting-03-publisher"

[[r2_buckets]]
binding = "POSTING_MEDIA_BUCKET"
bucket_name = "fbuploadprov2-prod-posting-media"

[[containers]]
class_name = "PostingDownloadContainer"
image = "../media-downloader-api/Dockerfile"
max_instances = 80

[[durable_objects.bindings]]
name = "POSTING_DOWNLOAD_CONTAINER"
class_name = "PostingDownloadContainer"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PostingDownloadContainer"]
