# Gitleaks configuration for FBUploadPro
# Excludes test fixtures with fake keys from secret scanning

[allowlist]
description = "Test files with fake keys"
paths = [
  '''packages/contracts/tests/''',
  '''apps/web/tests/''',
  '''apps/worker/tests/''',
  '''**/*.test.ts''',
  '''**/*.test.tsx''',
]
